name: Build AIX WhatsApp Local

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Inject build info (commit hash + date)
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}"
          $date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          $content = @"
          // Auto-generated by GitHub Actions build workflow.
          // Do not edit manually — BUILD_COMMIT is overwritten on each build.
          namespace AIXWhatsAppLocal;

          public static class BuildInfo
          {
              public const string Version = "0.2.3";
              public const string Commit = "$commit";
              public const string BuildDate = "$date";
          }
          "@
          Set-Content -Path BuildInfo.cs -Value $content.Trim() -Encoding UTF8
          Write-Host "BuildInfo.cs written with commit=$commit"

      - name: Publish single-file exe
        run: dotnet publish AIXWhatsAppLocal.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIXWhatsAppLocal
          path: publish/AIXWhatsAppLocal.exe

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AIXWhatsAppLocal.exe
          generate_release_notes: true